server {
    listen 80;
    server_name _;

    # documents fournisseurs déposés depuis le tableau de bord (API : 20 Mo max)
    client_max_body_size 25m;

    # API FastAPI (conteneur « api »), jamais exposée directement
    # Adresse du conteneur « api » relue via le DNS de Docker (127.0.0.11) :
    # sinon nginx garde l'ancienne adresse quand l'API est recréée (erreur 502).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_amont http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_amont;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Tableau de bord (fichiers statiques, navigation par ancre #/…)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
    }
}
