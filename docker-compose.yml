services:
  postgres:
    image: postgres:16-alpine
    container_name: conformite-postgres
    environment:
      POSTGRES_DB: conformite_dm
      POSTGRES_USER: conformite
      POSTGRES_PASSWORD: changer_ce_mot_de_passe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: conformite-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:

# Ollama n'est volontairement pas conteneurisé ici : à installer directement
# sur la machine hôte (ou le serveur GPU dédié) pour un accès direct au GPU.
# Voir README.md.
