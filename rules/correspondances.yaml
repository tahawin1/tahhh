# Rapprochement des réglementations — sept pays, une grille commune.
#
# Pivot : les quatre niveaux de risque de l'IMDRF (ex-GHTF, document
# GHTF/SG1/N77:2012 « Principles of Medical Devices Classification »), sur
# lesquels la plupart des classifications nationales sont calquées.
#
# À QUOI SERT CE FICHIER : aider la personne qui monte un dossier à situer un
# produit étranger (« classe 2 coréenne, c'est quoi au Maroc ? ») et à savoir
# quel document du pays d'origine prouve la mise sur le marché.
# CE QU'IL NE FAIT PAS : décider. La classe marocaine d'un dispositif se
# détermine par les règles de classification marocaines (arrêté 2855-15),
# et les pièces exigées par rules/maroc.yaml. Une correspondance de classe
# est indicative : deux systèmes peuvent classer différemment le même produit.
#
# statut : verifie    = repris d'un fichier de règles établi sur le texte indexé
#          partiel    = texte indexé et confronté ; quelques points restent à vérifier
#          provisoire = texte officiel pas encore indexé (voir
#                       scripts/telecharger_textes_pays.sh) : à confronter au texte
#
# VERSION 1 — 2026-10-01.

version: 1
date_version: "2026-10-01"

niveaux:
  - id: A
    libelle: "Risque faible"
  - id: B
    libelle: "Risque faible à modéré"
  - id: C
    libelle: "Risque modéré à élevé"
  - id: D
    libelle: "Risque élevé"

pays:
  maroc:
    nom: "Maroc (destination)"
    statut: verifie
    autorite: "AMMPS"
    texte: "Loi 84-12 ; décret 2-14-607 ; arrêté 2855-15"
    classes: {A: [I, IS, IM, IR], B: [IIA], C: [IIB], D: [III]}
    note_classes: "Classification calquée sur la directive 93/42/CEE (IR : voir rules/maroc.yaml 2.2)."
    preuve_mise_sur_le_marche: "Certificat d'enregistrement AMMPS (5 ans)"
    certificat_pour_export: null
    systeme_qualite: "ISO 13485 exigé pour IIA, IIB, III (arrêté 2855-15)"
    equivalence_etrangere: "Accepte les certificats étrangers comme pièce justificative (pièce 4)"
  union_europeenne:
    nom: "Union européenne"
    statut: verifie
    autorite: "Organismes notifiés + autorités compétentes"
    texte: "Règlement (UE) 2017/745 (MDR)"
    classes: {A: [I, Is, Im, Ir], B: [IIa], C: [IIb], D: [III]}
    preuve_mise_sur_le_marche: "Certificat CE de l'organisme notifié (+ lettre de confirmation 2023/607 si certificat MDD expiré)"
    certificat_pour_export: "Certificat de libre vente délivré par l'autorité compétente nationale (MDR, art. 60)"
    systeme_qualite: "ISO 13485 / annexe IX du MDR"
    equivalence_etrangere: "Aucune : évaluation de conformité UE complète obligatoire"
  chine:
    nom: "Chine"
    statut: verifie
    autorite: "NMPA"
    texte: "Règlement du Conseil d'État n°739 (2021)"
    classes: {A: [I], B: [II], C: [II, III], D: [III]}
    note_classes: "Trois classes : le niveau C se répartit entre II et III selon le produit."
    preuve_mise_sur_le_marche: "Certificat d'enregistrement NMPA (classes II, III) ou récépissé de déclaration (classe I)"
    certificat_pour_export: "Certificat de vente libre (autorité délivrante à confirmer dans le règlement 739)"
    systeme_qualite: "GMP chinoises des dispositifs médicaux"
    equivalence_etrangere: "Équivalence étrangère pour II/III, sauf dispositif innovant non commercialisé ailleurs"
  inde:
    nom: "Inde"
    statut: verifie
    autorite: "CDSCO"
    texte: "Medical Devices Rules 2017 et amendements"
    classes: {A: [A], B: [B], C: [C], D: [D]}
    preuve_mise_sur_le_marche: "Licence d'importation ou de fabrication CDSCO"
    certificat_pour_export: "Free Sale Certificate (CDSCO / autorité de l'État)"
    systeme_qualite: "Fifth Schedule des Medical Devices Rules 2017 (aligné ISO 13485)"
    equivalence_etrangere: "Dispense d'essai clinique local si FSC d'un pays reconnu (AU, CA, JP, UE, UK, USA)"
  etats_unis:
    nom: "États-Unis"
    statut: partiel
    autorite: "FDA (CDRH)"
    texte: "FD&C Act ; 21 CFR 807, 814, 820, 860"
    classes: {A: [I], B: [II], C: [II, III], D: [III]}
    note_classes: "Trois classes : la plupart des dispositifs IIb européens sont en classe II, certains en III."
    preuve_mise_sur_le_marche: "Lettre 510(k) (K…), approbation PMA (P…) ou décision De Novo (DEN…)"
    certificat_pour_export: "Certificate to Foreign Government (CFG) de la FDA (FD&C Act 801(e)(4), à vérifier)"
    systeme_qualite: "21 CFR 820 (QMSR, intègre ISO 13485:2016 depuis le 2 février 2026)"
    equivalence_etrangere: "Aucune : 510(k), PMA ou De Novo obligatoire"
  coree_du_sud:
    nom: "Corée du Sud"
    statut: partiel
    autorite: "MFDS"
    texte: "Medical Devices Act, décret et arrêté d'application"
    classes: {A: [I], B: [II], C: [III], D: [IV]}
    preuve_mise_sur_le_marche: "Notification (classe I), certification (classe II désignée) ou autorisation MFDS (classes II à IV), valable 5 ans"
    certificat_pour_export: "Certificate of Free Sale du MFDS (absent des textes indexés, à vérifier)"
    systeme_qualite: "KGMP exigé avant toute autorisation d'import (Medical Devices Act, art. 15 (4))"
    equivalence_etrangere: "À vérifier dans le texte indexé"
  pakistan:
    nom: "Pakistan"
    statut: provisoire
    autorite: "DRAP"
    texte: "DRAP Act 2012 ; Medical Devices Rules 2017 (S.R.O. 32(I)/2018)"
    classes: {A: [A], B: [B], C: [C], D: [D]}
    preuve_mise_sur_le_marche: "Certificat d'enregistrement ou d'inscription (enlistment) DRAP"
    certificat_pour_export: "Free Sale Certificate de la DRAP"
    systeme_qualite: "Licence d'établissement DRAP (exigences qualité à confirmer dans le texte)"
    equivalence_etrangere: "À vérifier dans le texte indexé"

# Thèmes communs : pour chaque thème, l'article qui le traite dans chaque pays.
# Références relevées dans les textes indexés (data/raw_pdfs/textes/, OCR
# compris) le 2026-10-01 ; `question` sert à la comparaison RAG des textes.
# Pakistan : seule la loi DRAP 2012 est indexée (Rules 2017 à obtenir).
themes:
  - id: classification
    question: "règles de classification des dispositifs médicaux selon le risque"
    articles:
      maroc: "Loi 84-12, art. 4 (classes I, IIa, IIb, III) ; arrêté 2856-15, annexe I (18 règles, reprises de la directive 93/42)"
      union_europeenne: "Règlement 2017/745, art. 51 et annexe VIII (22 règles)"
      chine: "Règlement 739, art. 6 (classes I à III selon le risque)"
      inde: "Medical Devices Rules 2017, règle 4 et First Schedule (classes A à D)"
      etats_unis: "21 CFR 860.3 (c) (classes I à III) ; De Novo : 21 CFR 860, art. 513(f)(2) FD&C Act"
      coree_du_sud: "Medical Devices Act, art. 3 ; Enforcement Rule, annexe 1 (classes I à IV)"
      pakistan: "Medical Devices Rules 2017 (classes A à D) — texte à obtenir"
  - id: mise_sur_le_marche
    question: "procédure d'autorisation ou d'enregistrement avant mise sur le marché"
    articles:
      maroc: "Loi 84-12, art. 12 à 15 (certificat d'enregistrement, dossier, données cliniques) ; arrêté 2855-15, art. 2 (pièces)"
      union_europeenne: "Règlement 2017/745, art. 52 (évaluation de la conformité) et annexes IX à XI"
      chine: "Règlement 739, art. 13 à 18 (déclaration classe I, enregistrement classes II et III)"
      inde: "Medical Devices Rules 2017, règles 34 à 36 (licence d'importation, formulaires MD-14/MD-15)"
      etats_unis: "21 CFR 807.81 (510(k)) ; 21 CFR 814 (PMA) ; 21 CFR 860 (De Novo)"
      coree_du_sud: "Medical Devices Act, art. 15 (autorisation d'importation) ; Enforcement Rule, art. 4 (notification, certification, autorisation selon la classe)"
      pakistan: "Loi DRAP 2012, art. 4 (1) (d) (évaluation, inscription ou enregistrement des dispositifs) ; procédure : Rules 2017"
  - id: preuve_pays_origine
    question: "autorisation de mise en vente délivrée par l'autorité du pays d'origine pour un dispositif importé"
    articles:
      maroc: "Arrêté 2855-15, art. 2 (1) a) : « certificat de marquage CE, ou attestation FDA, ou autorisation de mise en vente (CVL) ou équivalent délivrée par les autorités compétentes du pays d'origine » (classes IIa, IIb, III, Is, Im)"
      union_europeenne: "Aucune : le règlement 2017/745 n'accepte pas d'autorisation étrangère"
      chine: "Règlement 739, art. 15 et 16 : document de l'autorité du pays du fabricant autorisant la vente (sauf dispositif innovant)"
      inde: "Medical Devices Rules 2017, règle 36 (3) à (5) : free sale certificate (AU, CA, JP, UE, UK, USA : sans investigation clinique)"
      etats_unis: "Aucune : 510(k), PMA ou De Novo obligatoire"
      coree_du_sud: "Pas de reconnaissance trouvée dans les textes indexés"
      pakistan: "À vérifier dans les Rules 2017"
  - id: libre_vente
    question: "certificat de libre vente ou certificat pour l'exportation"
    articles:
      maroc: "Loi 84-12, art. 1 (10) ; arrêté 2855-15, art. 2 (2) : certificat de libre vente délivré par la DMP/AMMPS pour un dispositif fabriqué au Maroc et exporté"
      union_europeenne: "Règlement 2017/745, art. 60 (certificat de libre vente délivré par l'État membre)"
      chine: "Règlement 739, art. 59 (l'exportateur respecte les exigences du pays importateur) ; certificat de vente : à vérifier"
      inde: "Medical Devices Rules 2017, règle 36 (3) (free sale certificate des pays reconnus)"
      etats_unis: "Certificate to Foreign Government : FD&C Act, section 801(e)(4) — loi non indexée"
      coree_du_sud: "Absent des textes indexés (certificat à demander au fabricant)"
      pakistan: "À vérifier dans les Rules 2017"
  - id: systeme_qualite
    question: "exigences de système de management de la qualité du fabricant"
    articles:
      maroc: "Loi 84-12, art. 11 ; arrêté 2856-15, art. 3 (norme NM ISO 13485) ; arrêté 2855-15, art. 2 (ISO 13485 pour IIa, IIb, III)"
      union_europeenne: "Règlement 2017/745, art. 10 (9) et annexe IX"
      chine: "Règlement 739, art. 20, 33 et 35 (normes de gestion de la qualité de production)"
      inde: "Medical Devices Rules 2017, Fifth Schedule (Quality Management System)"
      etats_unis: "21 CFR 820.7 et 820.10 (QMSR, ISO 13485:2016 incorporée par référence)"
      coree_du_sud: "Medical Devices Act, art. 15 (4) ; Medical Device GMP Regulations (MFDS, 2026)"
      pakistan: "Loi DRAP 2012 (bonnes pratiques de fabrication) ; détail : Rules 2017"
  - id: representant
    question: "représentant local, mandataire ou agent du fabricant étranger"
    articles:
      maroc: "Arrêté 2855-15, art. 2 (1) a) : attestation du fabricant ou de son mandataire liant l'établissement demandeur ; loi 84-12, art. 7 (déclaration de l'établissement importateur)"
      union_europeenne: "Règlement 2017/745, art. 11 (mandataire)"
      chine: "Règlement 739, art. 15, 16 et 98 (personne morale chinoise désignée)"
      inde: "Medical Devices Rules 2017, règle 3 (f) (authorised agent) et règle 34"
      etats_unis: "21 CFR 807.3 (s) et 807.40 (United States agent)"
      coree_du_sud: "Medical Devices Act, art. 15 (1) (importateur autorisé)"
      pakistan: "À vérifier dans les Rules 2017"
  - id: etiquetage
    question: "exigences d'étiquetage et langue de la notice"
    articles:
      maroc: "Arrêté 2856-15, annexe II, point 14 : produits importés à usage professionnel : anglais et/ou français et/ou arabe ; grand public : français et/ou arabe"
      union_europeenne: "Règlement 2017/745, annexe I, section 23 ; langue fixée par l'État membre (art. 10)"
      chine: "Règlement 739, art. 39 ; art. 57 (notice et étiquettes en chinois pour les importations)"
      inde: "Medical Devices Rules 2017, règle 44"
      etats_unis: "21 CFR 801 (801.1, 801.15 : mentions en anglais)"
      coree_du_sud: "Medical Devices Act, art. 20 à 24"
      pakistan: "À vérifier dans les Rules 2017"
  - id: vigilance
    question: "matériovigilance et déclaration des incidents"
    articles:
      maroc: "Loi 84-12, art. 24 à 29 (matériovigilance, signalement, retrait, rappel)"
      union_europeenne: "Règlement 2017/745, art. 87 (incidents graves et mesures correctives)"
      chine: "Règlement 739, art. 61 à 67 (événements indésirables, réévaluation, rappel)"
      inde: "Medical Devices Rules 2017 : définition de l'événement indésirable grave (règle 3 (zq)) et du rappel (règle 3 (zr)) ; obligations à préciser"
      etats_unis: "21 CFR 803 (Medical Device Reporting, 803.50 pour le fabricant)"
      coree_du_sud: "Medical Devices Act, art. 31 (effets indésirables), 32 et 34 (rappel)"
      pakistan: "À vérifier dans les Rules 2017"

# Parcours d'un dispositif fabriqué dans le pays d'origine jusqu'au dépôt au
# Maroc (cas A du projet) : les étapes s'enchaînent d'un texte à l'autre.
parcours_vers_maroc:
  commun_maroc:
    - "Établissement importateur déclaré à l'administration (loi 84-12, art. 7 ; arrêté 2853-15)"
    - "Classe marocaine déterminée par les 18 règles de l'arrêté 2856-15, annexe I"
    - "Dossier d'enregistrement : pièces de l'arrêté 2855-15, art. 2 (1), numérotées (rules/maroc.yaml)"
    - "Données cliniques : investigation ou équivalence (loi 84-12, art. 15)"
    - "Étiquetage et notice : langues de l'arrêté 2856-15, annexe II, point 14"
    - "Dépôt physique le mercredi ou le jeudi ; certificat d'enregistrement valable 5 ans ; matériovigilance (art. 24 à 29)"
  union_europeenne:
    - "Fabricant : certificat CE d'un organisme notifié (règlement 2017/745, art. 52) ou certificat MDD prolongé (règlement 2023/607 + lettre de confirmation)"
    - "Pièce 4 au Maroc : ce certificat CE ; ISO 13485 (pièce 5) pour IIa, IIb, III"
  chine:
    - "Fabricant : enregistrement NMPA (règlement 739, art. 13 à 18) ou déclaration (classe I)"
    - "Pièce 4 au Maroc : certificat NMPA, traduit et légalisé"
  inde:
    - "Fabricant : licence CDSCO (Medical Devices Rules 2017)"
    - "Pièce 4 au Maroc : licence ou free sale certificate CDSCO, traduits et légalisés"
  etats_unis:
    - "Fabricant : 510(k) (21 CFR 807.81), PMA (21 CFR 814) ou De Novo ; enregistrement et listing (21 CFR 807)"
    - "Pièce 4 au Maroc : « attestation FDA » prévue par l'arrêté 2855-15 (autorisation + Certificate to Foreign Government)"
  coree_du_sud:
    - "Fabricant : notification, certification ou autorisation MFDS selon la classe (Enforcement Rule, art. 4) ; GMP"
    - "Pièce 4 au Maroc : certificat MFDS (et de libre vente), traduits et légalisés ; classe IV coréenne = classe III marocaine"
  pakistan:
    - "Fabricant : inscription ou enregistrement DRAP (loi DRAP 2012, art. 4 ; Rules 2017)"
    - "Pièce 4 au Maroc : certificat DRAP et de libre vente, traduits et légalisés"
