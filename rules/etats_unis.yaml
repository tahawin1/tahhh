# Règles réglementaires — États-Unis (pays d'origine possible du fournisseur)
# Sources (à indexer, voir scripts/telecharger_textes_pays.sh) :
#   Federal Food, Drug, and Cosmetic Act (FD&C Act), sections 510, 513, 515, 801
#   21 CFR 807 (enregistrement, listing, 510(k)), 814 (PMA), 820 (QMSR),
#   860 (classification), 801 (étiquetage)
# Autorité : FDA (Food and Drug Administration) — CDRH
#
# STATUT : VÉRIFIÉ (2026-10-02). Confronté aux textes indexés : 21 CFR
# (édition eCFR du 2026-09-25, data/raw_pdfs/textes/etats_unis_21cfr_*.txt) et
# FD&C Act, sections 510, 513, 515 et 801 (U.S. Code 2024,
# etats_unis_fdca_*.txt). Chaque point porte sa référence.
#
# Usage principal dans ce projet : identifier la pièce justificative
# américaine (autorisation FDA + certificat d'exportation) exigée par le
# Maroc pour un fournisseur américain (voir rules/maroc.yaml).

pays: etats_unis
statut: verifie
date_version: "2026-10-01"
autorite: "Food and Drug Administration (FDA) — Center for Devices and Radiological Health (CDRH)"
classification: [I, II, III]

classification_source: "21 CFR 860.3 (c) — trois catégories de contrôle réglementaire (vérifié)"

mise_sur_le_marche_par_classe:
  I: "contrôles généraux ; la plupart exemptés de notification préalable ; enregistrement et listing (21 CFR 807) (vérifié)"
  II: "contrôles spéciaux ; notification préalable 510(k) (21 CFR 807.81), sauf exemption (vérifié)"
  III: "autorisation préalable PMA (21 CFR 814.1 ; FD&C Act, section 515) ; demande De Novo (21 CFR 860 ; FD&C Act, section 513(f)(2)) pour un dispositif nouveau à classer en I ou II (vérifié)"

systeme_qualite:
  texte: "21 CFR 820 — Quality Management System Regulation (QMSR)"
  note: "intègre la norme ISO 13485:2016 par référence (21 CFR 820.7 et 820.10, vérifié ; en vigueur depuis le 2 février 2026)"

preuve_mise_sur_le_marche:
  document: "lettre d'autorisation 510(k), approbation PMA ou décision De Novo (numéro K…, P…, DEN…)"
  numero_autorisation: "numéro de l'autorisation (510(k), PMA, De Novo) déclaré au listing (21 CFR 807.28, vérifié)"
  certificat_exportation: "Certificate to Foreign Government (CFG) : certificat écrit délivré par la FDA à la demande de l'exportateur, sous 20 jours, attestant que le dispositif satisfait à la loi (FD&C Act, section 801(e)(4) (A) (ii), 21 U.S.C. 381 (e)(4), vérifié)"

equivalence_etrangere:
  acceptee: false
  note: "Aucune disposition ne reconnaît une autorisation étrangère à la place d'un 510(k), d'une PMA ou d'un De Novo (FD&C Act, sections 510 (k), 513 et 515, vérifié) ; le fabricant étranger s'enregistre comme un fabricant américain (section 510 (i))."

representant_local_requis: true
representant_local_nom: "United States agent du fabricant étranger (21 CFR 807.3 (s) et 807.40, vérifié)"

contraintes_operationnelles:
  langue_etiquetage: [anglais]

notes:
  - "Exemple : ciment osseux PMMA = classe II (contrôles spéciaux), 21 CFR 888.3027 (vérifié) — classe IIb au Maroc (dossier accepté Ciment osseux)."
  - "Trois classes seulement : la classe II américaine couvre à la fois des dispositifs IIa et IIb européens."
  - "Utilisé dans ce projet surtout comme SOURCE de l'autorisation FDA et du CFG à fournir au dossier marocain."
