# Checklist de vérification des dossiers d'enregistrement (Maroc) — transcrite
# fidèlement depuis le fichier Excel de l'entreprise (2026-10-01), puis
# rapprochée de la loi 84-12, des arrêtés 2855-15 / 2856-15 et des pièces de
# rules/maroc.yaml.
#
# STATUT : À VALIDER par l'entreprise avant que les contrôles soient codés.
#
# Pour chaque document :
#   piece_maroc / numero : pièce correspondante de rules/maroc.yaml (null : nouvelle)
#   fondement            : texte qui fonde l'exigence (ou « pratique »)
#   rapprochement        : conforme | ecart_classes (classes différentes de la loi)
#                          | valide_entreprise (écart tranché par l'entreprise, voir decisions)
#                          | nouveau_complement (complément d'une pièce existante)
#                          | nouveau_conditionnel (pièce nouvelle sous condition)
#                          | a_preciser
#   elements[].controle  : lecture   = valeur lue par l'agent dans le document
#                          coherence = comparaison entre documents (par le code)
#                          humain    = vérification visuelle par une personne
#                                      (signature, cachet, photos, intégrité…)

version: 1
date_version: '2026-10-01'
source: Checklist interne de vérification des dossiers réglementaires (fichier Excel transmis le 2026-10-01)
statut: decisions_appliquees  # toutes les décisions : voir `decisions` (maroc.yaml 2.4 et 2.5)
decisions:  # réponses de l'entreprise aux écarts (2026-10-01), appliquées dans rules/maroc.yaml 2.4
  - id: iso_toutes_classes
    reponse: "ISO 13485 exigé pour toutes les classes"
    applique: "maroc.yaml 2.4 (iso_13485 sans restriction de classe)"
  - id: valeur_unitaire
    reponse: "échantillon sous 500 $, facture pro-forma à partir de 500 $ ; valeur saisie à la création du dossier"
    applique: "maroc.yaml 2.4 (echantillon_modele_vente, facture_proforma, si_valeur_usd)"
  - id: equipement
    reponse: "case « équipement médical » à la création du dossier"
    applique: "maroc.yaml 2.4 (note_descriptive, documentation_technique, manuel_utilisation, si_equipement)"
  # réponses suivantes tirées des textes à la demande de l'entreprise, appliquées dans maroc.yaml 2.5
  - {id: fsc_toutes_classes, reponse: "Tiré des textes : hors UE, pièce 4 = autorisation du pays + FSC pour toutes les classes ; UE : certificat CE (Is à III), classe I : certificat de libre vente de l'État membre (MDR art. 60) — arrêté 2855-15 art. 2 (1) a)", question: "FSC exigé pour quelles origines (le dossier UE accepté n'en avait pas) et pour la classe I ?"}
  - {id: classe_iii_complements, reponse: "Tiré des textes : UE classe III : certificat d'évaluation de la documentation technique (MDR art. 52 (3), annexe IX) ou examen CE de la conception (directive 93/42, annexe II.4)", question: "CE Design (MDD) / certificat d'évaluation de la documentation technique (MDR) en complément de la pièce 4 ?"}
  - {id: etude_clinique_hors_ue, reponse: "Tiré des textes : loi 84-12 art. 15 ; hors UE, IIb et III : rapport d'évaluation ou d'investigation clinique ; UE : couvert par le certificat CE (MDR art. 61)", question: "Étude clinique exigée pour IIb/III quand il n'y a pas de certificat CE (origines hors UE) ?"}
  - {id: lettre_de_lien, reponse: "Tiré des textes : arrêté 2855-15 art. 2 (1) a) (lien fabricant – demandeur) ; exigée quand le fournisseur est un distributeur (case du dossier)", question: "Lettre de lien : quand le fournisseur n'est pas le fabricant ?"}
  - {id: declaration_societe, reponse: "Tiré des textes : déclaration de l'établissement importateur (loi 84-12 art. 7 ; modèle : arrêté 2853-15), copie jointe", question: "Déclaration de la société : contenu, modèle ?"}
  - {id: quittance, reponse: "Tiré des textes : exigée par l'arrêté 2855-15 art. 2 (1) a) — gardée, hors numérotation", question: "Quittance des droits : exigée par l'arrêté 2855-15 mais absente de la checklist et du dossier accepté ?"}
  - {id: numerotation, reponse: "Aucun texte ne fixe de numéros : ceux du dossier accepté sont gardés, pièces nouvelles sans numéro", question: "Numéros des nouvelles pièces (10 à 13, 15 libres) ?"}
